name: Build Android APK (VOUT)

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip triggering new EAS build and publish latest finished APK'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'app.json'
      - 'package.json'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Android APK & Release
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔨 Trigger EAS Build APK
        if: ${{ !inputs.skip_build }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli build -p android --profile preview --wait --non-interactive

      - name: 📥 Fetch & Download Built APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Fetching latest finished build from EAS..."
          npx --yes eas-cli build:list --platform android --status finished --limit 1 --json > build.json
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("build.json", "utf8");
            const data = JSON.parse(raw);
            const build = Array.isArray(data) ? data[0] : data;
            if (!build) {
              console.error("No finished build found on EAS!");
              process.exit(1);
            }
            const url = build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl;
            console.log("Latest Finished Build ID:", build.id);
            console.log("APK Artifact URL:", url);
            if (!url) {
              console.error("No APK download URL found in build artifacts!");
              process.exit(1);
            }
            fs.writeFileSync("apk_url.txt", url.trim());
          '
          APK_URL=$(cat apk_url.txt)
          echo "Downloading VOUT.apk from $APK_URL ..."
          curl -L -o VOUT.apk "$APK_URL"
          ls -lh VOUT.apk

      - name: 🏷 Extract Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🚀 Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "VOUT v${{ env.APP_VERSION }}"
          body: |
            ### 📱 VOUT v${{ env.APP_VERSION }} - Official Android Release

            Descarga directa de **VOUT** en 1 solo clic para dispositivos Android.
            
            #### ⚡ Descarga Directa
            - **[⬇️ Descargar VOUT.apk](https://github.com/AgustinMilesi/expenses/releases/latest/download/VOUT.apk)**
            
            #### 📋 Información de Build
            - **Versión de App:** `v${{ env.APP_VERSION }}`
            - **Canal:** `production`
            - **Compatibilidad:** Android 8.0+
          files: VOUT.apk
          draft: false
          prerelease: false
          make_latest: true
